<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    body { width: 320px; background: #0f172a; color: #f8fafc; font-family: system-ui, sans-serif; padding: 14px; margin: 0; }
    h2 { font-size: 14px; margin: 0 0 10px 0; color: #a5b4fc; }
    h3 { font-size: 12px; margin: 12px 0 6px 0; color: #a5b4fc; border-top: 1px solid #1e293b; padding-top: 10px; }
    .input-group { margin-bottom: 8px; }
    label { font-size: 11px; color: #94a3b8; display: block; margin-bottom: 2px; }
    input[type=text], input[type=password] { width: 100%; box-sizing: border-box; background: #1e293b; border: 1px solid #334155; color: #fff; padding: 6px 8px; border-radius: 6px; font-size: 12px; }
    button { width: 100%; padding: 7px; background: #6366f1; border: none; color: #fff; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; margin-top: 4px; }
    button:hover { background: #4f46e5; }
    .status { font-size: 11px; text-align: center; margin-top: 6px; color: #10b981; min-height: 16px; }
    .hint { font-size: 10px; color: #64748b; line-height: 1.5; margin-top: 4px; }
    .row { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #cbd5e1; }
  </style>
</head>
<body>
  <h2>📓 LexiContext 同步设置</h2>

  <h3 style="border:none;padding:0;margin-top:0;">Notion 词库</h3>
  <div class="input-group">
    <label>Notion API Key（Internal Integration Secret）</label>
    <input type="password" id="notionKey" placeholder="secret_..." />
  </div>
  <div class="input-group">
    <label>Notion Database ID（32 位，去掉横线）</label>
    <input type="text" id="notionDbId" placeholder="xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" />
  </div>
  <div class="hint">数据库需新建 5 列：Word（Title）、Status（Select，含 Learning / Review / Mastered）、English Def、Chinese Def、Context（均为 Text），并把 Integration 分享给该数据库。</div>

  <h3>Anki（经由 AnkiConnect）</h3>
  <div class="row">
    <input type="checkbox" id="ankiEnabled" />
    <label for="ankiEnabled" style="display:inline;margin:0;">启用同步到 Anki</label>
  </div>
  <div class="hint">需在电脑上打开 Anki 桌面版，并安装 AnkiConnect 插件（代码 2055492159）。单词会写入牌组 LexiContext。</div>

  <button id="saveBtn">💾 保存配置</button>
  <button id="syncNowBtn" style="background:#10b981; margin-top:6px;">⚡ 立即同步当前页面的全部单词</button>
  <div id="statusMsg" class="status"></div>

  <script>
    chrome.storage.local.get(["notionApiKey", "notionDatabaseId", "ankiEnabled"], (res) => {
      if (res.notionApiKey) document.getElementById("notionKey").value = res.notionApiKey;
      if (res.notionDatabaseId) document.getElementById("notionDbId").value = res.notionDatabaseId;
      document.getElementById("ankiEnabled").checked = !!res.ankiEnabled;
    });

    document.getElementById("saveBtn").onclick = () => {
      const key = document.getElementById("notionKey").value.trim();
      const dbId = document.getElementById("notionDbId").value.trim().replace(/-/g, "");
      const anki = document.getElementById("ankiEnabled").checked;
      chrome.storage.local.set({ notionApiKey: key, notionDatabaseId: dbId, ankiEnabled: anki }, () => {
        document.getElementById("statusMsg").textContent = "✅ 配置已保存！";
      });
    };

    document.getElementById("syncNowBtn").onclick = () => {
      document.getElementById("statusMsg").textContent = "⏳ 正在请求页面数据…";
      chrome.runtime.sendMessage({ type: "TRIGGER_NOTION_SYNC" }, (resp) => {
        document.getElementById("statusMsg").textContent = (resp && resp.msg) || "同步完成！";
      });
    };
  </script>
</body>
</html>
